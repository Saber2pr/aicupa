<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Aicupa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 420px;
    padding: 24px 20px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    margin: 16px;
  }
  #clerk-mount { min-height: 200px; }
  #clerk-mount .cl-rootBox { width: 100% !important; }
  #clerk-mount .cl-card { background: transparent !important; box-shadow: none !important; border: none !important; }
  #status {
    text-align: center;
    font-size: 13px;
    margin-top: 12px;
    min-height: 24px;
    color: #888;
  }
  .success-view { text-align: center; padding: 32px 0; }
  .success-icon {
    width: 48px; height: 48px; margin: 0 auto 16px;
    background: rgba(34,197,94,0.15); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #4ade80; font-size: 24px;
  }
  .success-text { font-size: 15px; font-weight: 500; color: #4ade80; margin-bottom: 8px; }
  .success-sub { font-size: 12px; color: #888; }
</style>
</head>
<body>
<div class="card">
  <div id="clerk-mount"></div>
  <div id="status">Loading...</div>
</div>

<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsuYWljdXBhLmNvbSQ"
  src="https://clerk.aicupa.com/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
></script>

<script>
var statusEl = document.getElementById('status');

function setStatus(text, color) {
  statusEl.textContent = text;
  statusEl.style.color = color || '#888';
}

function waitForClerk(timeout) {
  var deadline = Date.now() + (timeout || 15000);
  return new Promise(function (resolve, reject) {
    (function check() {
      if (window.Clerk) return resolve(window.Clerk);
      if (Date.now() > deadline) return reject(new Error('Clerk load timeout'));
      setTimeout(check, 100);
    })();
  });
}

function sendToOpener(token, userId, email) {
  if (window.opener) {
    try {
      window.opener.postMessage({
        type: 'aicupa-auth-callback',
        token: token,
        userId: userId,
        email: email,
      }, '*');
    } catch (e) { /* ignore */ }
  }
}

function showSuccess(email) {
  var mount = document.getElementById('clerk-mount');
  mount.innerHTML =
    '<div class="success-view">' +
      '<div class="success-icon">&#10003;</div>' +
      '<div class="success-text">Signed in successfully!</div>' +
      '<div class="success-sub">' + (email || '') + '</div>' +
    '</div>';
  setStatus('This window will close automatically...', '#4ade80');
  setTimeout(function () { window.close(); }, 2000);
}

async function handleSignedIn(clerk) {
  if (!clerk.session || !clerk.user) return;

  var userId = clerk.user.id;
  var email = '';
  if (clerk.user.primaryEmailAddress) {
    email = clerk.user.primaryEmailAddress.emailAddress;
  } else if (clerk.user.emailAddresses && clerk.user.emailAddresses.length > 0) {
    email = clerk.user.emailAddresses[0].emailAddress;
  }

  setStatus('Getting token...', '#7c6af7');

  var token = null;
  try { token = await clerk.session.getToken({ template: 'supabase' }); } catch (e) { /* ignore */ }
  if (!token) {
    try { token = await clerk.session.getToken(); } catch (e) { /* ignore */ }
  }

  if (token) {
    sendToOpener(token, userId, email);
    showSuccess(email);
  } else {
    setStatus('Failed to get token', '#ff6b6b');
  }
}

function isRefreshMode() {
  return new URLSearchParams(window.location.search).get('mode') === 'refresh';
}

function sendToParent(token, userId, email) {
  if (window.parent && window.parent !== window) {
    try {
      window.parent.postMessage({
        type: 'aicupa-auth-callback',
        token: token,
        userId: userId,
        email: email,
      }, '*');
    } catch (e) { /* ignore */ }
  }
}

async function silentRefresh(clerk) {
  if (!clerk.session) {
    sendToParent(null, null, null);
    sendToOpener(null, null, null);
    return;
  }
  var token = null;
  try { token = await clerk.session.getToken({ template: 'supabase' }); } catch (e) { /* ignore */ }
  var userId = clerk.user ? clerk.user.id : null;
  var email = '';
  if (clerk.user) {
    if (clerk.user.primaryEmailAddress) {
      email = clerk.user.primaryEmailAddress.emailAddress;
    } else if (clerk.user.emailAddresses && clerk.user.emailAddresses.length > 0) {
      email = clerk.user.emailAddresses[0].emailAddress;
    }
  }
  sendToParent(token, userId, email);
  sendToOpener(token, userId, email);
}

async function init() {
  try {
    var clerk = await waitForClerk(15000);

    if (typeof clerk.load === 'function') {
      await clerk.load();
    }

    if (isRefreshMode()) {
      await silentRefresh(clerk);
      return;
    }

    if (clerk.user && clerk.session) {
      await handleSignedIn(clerk);
      return;
    }

    setStatus('');
    clerk.mountSignIn(document.getElementById('clerk-mount'), {
      appearance: {
        variables: {
          colorBackground: '#1a1a1a',
          colorText: '#e5e5e5',
          colorTextSecondary: '#999',
          colorPrimary: '#7c6af7',
          colorInputBackground: '#111',
          colorInputText: '#e5e5e5',
          borderRadius: '10px',
        },
      },
    });

    clerk.addListener(function (resources) {
      if (resources.session && resources.user) {
        handleSignedIn(clerk);
      }
    });
  } catch (err) {
    if (isRefreshMode()) {
      sendToParent(null, null, null);
    } else {
      setStatus('Error: ' + (err.message || err), '#ff6b6b');
    }
  }
}

init();
</script>
</body>
</html>
